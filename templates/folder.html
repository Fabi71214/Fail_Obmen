<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Файлообменник - Папка</title>
    <link rel="stylesheet" href="/static/folder.css">
</head>
<body>
    <div class="push-notification" id="pushNotification">
        <div class="push-toast" id="pushToast"></div>
    </div>

    <div class="header">
        <div class="nav-container">
            <div class="logo">
                <h1>FILEBOX</h1>
                <div class="logo-glow"></div>
            </div>
            <div class="user-info">
                <span class="status-dot"></span>
                Авторизованный доступ
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="action-bar">
            <a href="/success" class="back-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                <span>Назад</span>
            </a>
            <button type="button" class="delete-folder-btn" id="deleteFolderBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
                <span>Удалить папку</span>
            </button>
        </div>

        <div class="upload-section">
            <h2 class="section-title">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                </svg>
                Загрузка файлов
            </h2>
            <form class="upload-form" id="uploadFileForm">
                <input type="file" name="file" id="fileInput" class="file-input" multiple required>
                <button type="submit" class="upload-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                    </svg>
                    <span>Загрузить</span>
                </button>
            </form>
            <div class="upload-progress" id="uploadProgress"></div>
        </div>

        <div class="files-section">
            <h2 class="section-title">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
                Папка: {{ folder }}
            </h2>
            <ul class="file-list" id="fileList">
                <div class="empty-state">
                    <div class="empty-icon">📁</div>
                    <p>В папке пока пусто</p>
                    <span>Загрузите первый файл</span>
                </div>
            </ul>
        </div>
    </div>

    <script src="/static/folder.js"></script>
    <script>
        const username = {{ username | tojson }};
        const folder = {{ folder | tojson }};
        const fileListData = {{ files | tojson }};
        
        initFolderPage(username, folder, fileListData);
    </script>
</body>
</html>
