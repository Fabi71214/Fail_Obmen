<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FILEBOX - {{ folder }}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            color: #ffffff;
            position: relative;
        }

        /* Animated gradient background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 107, 107, 0.06) 0%, transparent 50%);
            animation: backgroundMove 15s ease infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes backgroundMove {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        /* Header */
        .header {
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            animation: slideDown 0.6s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            position: relative;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a8a8a8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-glow {
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #7877C6, transparent);
            animation: logoGlow 2s ease infinite;
        }

        @keyframes logoGlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .user-info {
            color: #999;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #34d399;
            border-radius: 50%;
            animation: pulse 2s ease infinite;
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.5);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main container */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 30px;
            position: relative;
            z-index: 10;
        }

        /* Action bar */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            gap: 15px;
            animation: fadeIn 0.8s ease 0.2s backwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-style {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: #ffffff;
            white-space: nowrap;
        }

        .btn-style::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-style:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-style:hover {
            transform: translateY(-2px);
        }

        .btn-style:active {
            transform: translateY(0);
        }

        .back-btn {
            background: rgba(30, 30, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .back-btn:hover {
            background: rgba(40, 40, 40, 0.8);
            border-color: rgba(120, 119, 198, 0.5);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .delete-folder-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        .delete-folder-btn:hover {
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
        }

        /* Upload section */
        .upload-section {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease 0.3s backwards;
        }

        .section-title {
            color: #ffffff;
            margin-bottom: 25px;
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title svg {
            color: #7877C6;
        }

        .upload-form {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .file-input {
            flex: 1;
            min-width: 200px;
            padding: 14px 18px;
            background: rgba(30, 30, 30, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .file-input:focus {
            outline: none;
            border-color: #7877C6;
            background: rgba(40, 40, 40, 0.8);
            box-shadow: 0 0 0 4px rgba(120, 119, 198, 0.1);
        }

        .upload-btn {
            padding: 14px 28px;
            background: linear-gradient(135deg, #7877C6 0%, #5e5da8 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(120, 119, 198, 0.4);
            position: relative;
            overflow: hidden;
        }

        .upload-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .upload-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(120, 119, 198, 0.5);
        }

        .upload-btn:active {
            transform: translateY(0);
        }

        .upload-progress {
            display: none;
            margin-top: 20px;
            padding: 14px 18px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            color: #93c5fd;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        /* Files section */
        .files-section {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s ease 0.4s backwards;
        }

        /* File grid */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 24px;
        }

        .file-card {
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .file-card:hover {
            transform: translateY(-6px);
            border-color: rgba(120, 119, 198, 0.4);
            box-shadow: 0 12px 40px rgba(120, 119, 198, 0.2);
        }

        .file-card-preview {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(20, 20, 20, 0.6);
            position: relative;
            overflow: hidden;
        }

        .file-card-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .file-card-icon {
            font-size: 4rem;
            filter: drop-shadow(0 4px 12px rgba(120, 119, 198, 0.3));
            transition: transform 0.3s ease;
        }

        .file-card:hover .file-card-icon {
            transform: scale(1.1);
        }

        .file-card-body {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .file-card-name {
            color: #ffffff;
            font-weight: 500;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            flex: 1;
        }

        .file-card-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .action-btn.download {
            background: rgba(120, 119, 198, 0.2);
            color: #7877C6;
            border: 1px solid rgba(120, 119, 198, 0.3);
        }

        .action-btn.download:hover {
            background: rgba(120, 119, 198, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(120, 119, 198, 0.3);
        }

        .action-btn.delete {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        .action-btn.delete:hover {
            background: rgba(255, 107, 107, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #666;
            grid-column: 1 / -1;
            animation: fadeIn 1s ease;
        }

        .empty-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            opacity: 0.5;
            animation: float 3s ease infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .empty-state p {
            font-size: 1.3rem;
            font-weight: 600;
            color: #999;
            margin-bottom: 10px;
        }

        .empty-state span {
            font-size: 0.95rem;
            color: #666;
        }

        /* Image preview modal */
        .image-preview-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .image-preview-overlay.active {
            display: flex;
        }

        .image-preview-container {
            max-width: 90vw;
            max-height: 90vh;
            position: relative;
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .image-preview-container img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .image-preview-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 1.2rem;
        }

        .image-preview-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Push notification */
        .push-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            pointer-events: none;
        }

        .push-toast {
            min-width: 280px;
            max-width: 400px;
            padding: 16px 24px;
            border-radius: 12px;
            background: rgba(30, 42, 54, 0.95);
            backdrop-filter: blur(12px);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border-left: 4px solid #7877C6;
            opacity: 0;
            transform: translateX(400px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .push-toast.show {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .nav-container {
                padding: 0 20px;
            }

            .main-container {
                padding: 30px 20px;
            }

            .action-bar {
                flex-direction: column;
            }

            .btn-style {
                width: 100%;
                justify-content: center;
            }

            .upload-section,
            .files-section {
                padding: 30px 20px;
                border-radius: 20px;
            }

            .section-title {
                font-size: 1.3rem;
            }

            .upload-form {
                flex-direction: column;
            }

            .file-input {
                width: 100%;
            }

            .upload-btn {
                width: 100%;
                justify-content: center;
            }

            .file-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 16px;
            }

            .file-card-preview {
                height: 140px;
            }

            .file-card-icon {
                font-size: 3rem;
            }

            .push-notification {
                top: 10px;
                right: 10px;
                left: 10px;
            }

            .push-toast {
                min-width: auto;
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .nav-container {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .logo h1 {
                font-size: 1.5rem;
            }

            .user-info {
                font-size: 0.8rem;
            }

            .upload-section,
            .files-section {
                padding: 25px 15px;
            }

            .section-title {
                font-size: 1.2rem;
                gap: 8px;
            }

            .section-title svg {
                width: 20px;
                height: 20px;
            }

            .file-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .file-card-preview {
                height: 120px;
            }

            .file-card-body {
                padding: 15px;
                gap: 10px;
            }

            .file-card-name {
                font-size: 0.85rem;
            }

            .action-btn {
                font-size: 0.75rem;
                padding: 6px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="push-notification" id="pushNotification">
        <div class="push-toast" id="pushToast"></div>
    </div>

    <!-- Image preview overlay -->
    <div class="image-preview-overlay" id="imagePreviewOverlay">
        <div class="image-preview-container">
            <button class="image-preview-close" id="imagePreviewClose">&times;</button>
            <img src="" alt="Preview" id="imagePreviewImg">
        </div>
    </div>

    <div class="header">
        <div class="nav-container">
            <div class="logo">
                <h1>FILEBOX</h1>
                <div class="logo-glow"></div>
            </div>
            <div class="user-info">
                <span class="status-dot"></span>
                <span>{{ username }}</span>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="action-bar">
            <a href="/success" class="btn-style back-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                <span>Назад к папкам</span>
            </a>
            <button type="button" class="btn-style delete-folder-btn" id="deleteFolderBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
                <span>Удалить папку</span>
            </button>
        </div>

        <div class="upload-section">
            <h2 class="section-title">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                </svg>
                Загрузка файлов
            </h2>
            <form class="upload-form" id="uploadFileForm">
                <input type="file" name="file" id="fileInput" class="file-input" multiple required>
                <button type="submit" class="upload-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                    </svg>
                    <span>Загрузить</span>
                </button>
            </form>
            <div class="upload-progress" id="uploadProgress"></div>
        </div>

        <div class="files-section">
            <h2 class="section-title">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
                Содержимое папки: {{ folder }}
            </h2>
            <div class="file-grid" id="fileGrid">
                <!-- Files will be rendered here -->
            </div>
        </div>
    </div>

    <script>
        // Получаем переменные из Jinja шаблона
        const currentUsername = {{ username | tojson }};
        const currentFolder = {{ folder | tojson }};
        let currentFiles = {{ files | tojson }} || [];

        // Расширения изображений
        const imageExtensions = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp', 'ico', 'tiff', 'tif', 'avif'];

        // Иконки для разных типов файлов
        const fileIcons = {
            exe: '⚙️',
            dmg: '⚙️',
            app: '⚙️',
            zip: '📦',
            rar: '📦',
            '7z': '📦',
            tar: '📦',
            gz: '📦',
            pdf: '📄',
            doc: '📝',
            docx: '📝',
            txt: '📃',
            md: '📃',
            ppt: '📊',
            pptx: '📊',
            xls: '📊',
            xlsx: '📊',
            csv: '📊',
            mp3: '🎵',
            wav: '🎵',
            flac: '🎵',
            aac: '🎵',
            ogg: '🎵',
            wma: '🎵',
            mp4: '🎬',
            avi: '🎬',
            mkv: '🎬',
            mov: '🎬',
            wmv: '🎬',
            flv: '🎬',
            webm: '🎬',
            html: '🌐',
            css: '🎨',
            js: '📜',
            jsx: '📜',
            ts: '📜',
            tsx: '📜',
            py: '🐍',
            java: '☕',
            cpp: '⚡',
            c: '⚡',
            h: '⚡',
            php: '🐘',
            rb: '💎',
            go: '🔹',
            rs: '🦀',
            swift: '🕊️',
            kt: '📱',
            json: '📋',
            xml: '📋',
            yaml: '📋',
            yml: '📋',
            toml: '📋',
            ini: '📋',
            cfg: '📋',
            log: '📋',
            sql: '🗄️',
            db: '🗄️',
            sqlite: '🗄️',
            psd: '🖼️',
            ai: '🖼️',
            fig: '🖼️',
            sketch: '🖼️',
            iso: '💿',
            dll: '🔧',
            so: '🔧',
            dylib: '🔧',
            default: '📁'
        };

        function getFileExtension(filename) {
            return filename.split('.').pop().toLowerCase();
        }

        function isImageFile(filename) {
            const ext = getFileExtension(filename);
            return imageExtensions.includes(ext);
        }

        function getFileIcon(filename) {
            const ext = getFileExtension(filename);
            return fileIcons[ext] || fileIcons.default;
        }

        function getFilePreviewUrl(filename) {
            if (isImageFile(filename)) {
                return `/download/${currentUsername}/${currentFolder}/${filename}`;
            }
            return null;
        }

        // Инициализация при загрузке DOM
        document.addEventListener('DOMContentLoaded', () => {
            renderFileList();
            setupEventListeners();
            setupImagePreview();
        });

        function setupEventListeners() {
            const uploadForm = document.getElementById('uploadFileForm');
            if (uploadForm) {
                uploadForm.addEventListener('submit', handleFileUpload);
            }

            const deleteFolderBtn = document.getElementById('deleteFolderBtn');
            if (deleteFolderBtn) {
                deleteFolderBtn.addEventListener('click', handleDeleteFolder);
            }
        }

        function setupImagePreview() {
            const overlay = document.getElementById('imagePreviewOverlay');
            const closeBtn = document.getElementById('imagePreviewClose');
            const previewImg = document.getElementById('imagePreviewImg');

            closeBtn.addEventListener('click', () => {
                overlay.classList.remove('active');
            });

            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    overlay.classList.remove('active');
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && overlay.classList.contains('active')) {
                    overlay.classList.remove('active');
                }
            });
        }

        function openImagePreview(imageUrl) {
            const overlay = document.getElementById('imagePreviewOverlay');
            const previewImg = document.getElementById('imagePreviewImg');
            
            previewImg.src = imageUrl;
            overlay.classList.add('active');
        }

        function renderFileList() {
            const fileGridEl = document.getElementById('fileGrid');
            
            if (!currentFiles || currentFiles.length === 0) {
                fileGridEl.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📁</div>
                        <p>В папке пока пусто</p>
                        <span>Загрузите первый файл для начала работы</span>
                    </div>`;
                return;
            }

            fileGridEl.innerHTML = '';
            
            currentFiles.forEach((fileName, index) => {
                const card = document.createElement('div');
                card.className = 'file-card';
                card.style.animationDelay = `${index * 0.05}s`;
                
                const previewUrl = getFilePreviewUrl(fileName);
                const isImage = isImageFile(fileName);
                const icon = getFileIcon(fileName);
                
                let previewHTML = '';
                if (isImage && previewUrl) {
                    previewHTML = `<img src="${previewUrl}" alt="${fileName}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                   <div class="file-card-icon" style="display: none;">${icon}</div>`;
                } else {
                    previewHTML = `<div class="file-card-icon">${icon}</div>`;
                }
                
                card.innerHTML = `
                    <div class="file-card-preview">
                        ${previewHTML}
                    </div>
                    <div class="file-card-body">
                        <div class="file-card-name" title="${fileName}">${fileName}</div>
                        <div class="file-card-actions">
                            <a href="/download/${currentUsername}/${currentFolder}/${fileName}" class="action-btn download" target="_blank">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                                </svg>
                                Скачать
                            </a>
                            <button onclick="event.stopPropagation(); deleteFile('${fileName}')" class="action-btn delete">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                                Удалить
                            </button>
                        </div>
                    </div>
                `;
                
                // Добавляем обработчик клика для предпросмотра изображений
                if (isImage && previewUrl) {
                    card.addEventListener('click', () => {
                        openImagePreview(previewUrl);
                    });
                    card.style.cursor = 'pointer';
                }
                
                fileGridEl.appendChild(card);
            });
        }

        async function handleFileUpload(e) {
            e.preventDefault();
            const fileInput = document.getElementById('fileInput');
            const files = Array.from(fileInput.files);
            
            if (files.length === 0) return;

            const progressEl = document.getElementById('uploadProgress');
            progressEl.style.display = 'block';
            
            for (let i = 0; i < files.length; i++) {
                await uploadSingleFile(files[i], i + 1, files.length, progressEl);
            }
            
            showNotification('Все файлы успешно обработаны', 'success');
            
            setTimeout(() => {
                progressEl.style.display = 'none';
            }, 2000);
            
            fileInput.value = ''; 
        }

        function uploadSingleFile(file, currentIndex, totalFiles, progressEl) {
            return new Promise((resolve) => {
                const formData = new FormData();
                formData.append('file', file);

                const xhr = new XMLHttpRequest();
                xhr.open('POST', `/upload_file/${currentUsername}/${currentFolder}`, true);

                xhr.upload.onprogress = function(event) {
                    if (event.lengthComputable) {
                        const percentComplete = Math.round((event.loaded / event.total) * 100);
                        progressEl.textContent = `Загрузка: ${file.name} (${currentIndex} из ${totalFiles}) - ${percentComplete}%`;
                        progressEl.style.background = `linear-gradient(90deg, rgba(59, 130, 246, 0.2) ${percentComplete}%, transparent ${percentComplete}%)`;
                    }
                };

                xhr.onload = function() {
                    if (xhr.status === 200) {
                        try {
                            const response = JSON.parse(xhr.responseText);
                            if (response.status === 'success') {
                                if (!currentFiles.includes(response.filename)) {
                                    currentFiles.push(response.filename);
                                }
                                renderFileList();
                            } else {
                                showNotification(response.message || 'Ошибка загрузки', 'error');
                            }
                        } catch (e) {
                            showNotification('Ошибка обработки ответа', 'error');
                        }
                    } else {
                        showNotification(`Ошибка сервера при загрузке ${file.name}`, 'error');
                    }
                    resolve(); 
                };

                xhr.onerror = function() {
                    showNotification(`Сетевая ошибка при загрузке ${file.name}`, 'error');
                    resolve();
                };

                xhr.send(formData);
            });
        }

        async function handleDeleteFolder() {
            if (!confirm(`Удалить папку "${currentFolder}" и все её содержимое? Это действие необратимо.`)) {
                return;
            }

            try {
                const response = await fetch(`/delete_papk/${currentUsername}/${currentFolder}`, {
                    method: 'POST'
                });
                
                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    showNotification('Папка успешно удалена', 'success');
                    setTimeout(() => {
                        window.location.href = '/success';
                    }, 1000);
                } else {
                    showNotification(result.message || 'Ошибка при удалении папки', 'error');
                }
            } catch (error) {
                console.error(error);
                showNotification('Сетевая ошибка при удалении папки', 'error');
            }
        }

        async function deleteFile(fileName) {
            if (!confirm(`Удалить файл "${fileName}"?`)) return;

            try {
                const response = await fetch(`/delete/${currentUsername}/${currentFolder}/${fileName}`, {
                    method: 'POST'
                });

                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    showNotification('Файл удален', 'success');
                    currentFiles = currentFiles.filter(f => f !== fileName);
                    renderFileList();
                } else {
                    showNotification(result.message || 'Ошибка удаления файла', 'error');
                }
            } catch (error) {
                console.error(error);
                showNotification('Сетевая ошибка при удалении файла', 'error');
            }
        }

        function showNotification(message, type = 'info') {
            const container = document.getElementById('pushNotification');
            const toast = document.getElementById('pushToast');
            
            if (!container || !toast) return;

            toast.textContent = message;
            
            toast.style.borderLeft = type === 'error' ? '4px solid #ff6b6b' : 
                                     type === 'success' ? '4px solid #34d399' : 
                                     '4px solid var(--primary)';

            container.classList.add('show');
            
            setTimeout(() => {
                container.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
